[package]
name = "ii-drive"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
regex = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
bytes = "1"
futures = "0.3"
grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
hex = "0.4"
hmac = "0.13"
mime_guess = "2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
surrealdb = { version = "=3.2.4", default-features = false, features = ["kv-surrealkv"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

