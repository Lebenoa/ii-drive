[package]
name = "ii-drive"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
regex = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
bytes = "1"
futures = "0.3"
grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
hex = "0.4"
hmac = "0.13"
# Still-image decode + JPEG encode in-process. `rayon` is off: thumbnails
# run on a blocking pool already, a second thread pool would oversubscribe.
# `webp` is decode-only here (the encoder is lossless-only); bmp/tiff/ico
# keep thumbnail coverage for camera and scanner formats ffmpeg used to
# handle. AVIF/HEIC stills are not decodable in-process.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
mime_guess = "2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
surrealdb = { version = "=3.2.4", default-features = false, features = ["kv-surrealkv"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"

[dev-dependencies]
tempfile = "3"
# Tests open a store per case. The in-memory engine is the same `local::Db`
# type as the file-backed one but needs no temp directory and runs the suite
# in ~1.5s instead of ~6.5s; only the persistence test wants a real file.
surrealdb = { version = "=3.2.4", default-features = false, features = ["kv-mem"] }

[profile.release]
# Whole-program view: fat LTO plus a single codegen unit let LLVM inline
# and prune across crate boundaries. Compile time rises sharply; that cost
# belongs to releases only.
opt-level = 3
lto = "fat"
codegen-units = 1
# No unwinding machinery: smaller binary, faster panic path. Consequence:
# a panic in ANY task takes down the whole process instead of killing only
# that task (tokio can no longer contain it).
panic = "abort"
strip = true

