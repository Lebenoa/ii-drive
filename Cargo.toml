[package]
name = "ii-drive"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
surrealdb = { version = "=3.2.4", default-features = false, features = ["kv-surrealkv"] }
grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
rand = "0.9"
ulid = "1"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
