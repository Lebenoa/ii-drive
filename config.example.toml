# ii-drive — Telegram Drive configuration
# Copy this file to config.toml and fill in your values.
#
# Every key below is optional — the server starts with these defaults if
# config.toml is missing or a key is omitted. Only api_id/api_hash are
# needed before the drive is usable.

# HTTP server bind address
host = "127.0.0.1"
port = 8080

# Telegram API credentials — create an app at https://my.telegram.org/apps
api_id = 0
api_hash = ""

# Secret used to sign session tokens (NOT a login password — logging in is
# done through Telegram). Leave unset and a random secret is generated and
# stored beside the database on first start. Set your own long random
# string only if you need tokens to survive wiping the data directory;
# anyone who knows this value can forge tokens.
# secret = "a-long-random-string-you-keep-safe"

# Phone numbers allowed to log in via Telegram. Login sends a Telegram code
# to the number, so possession of that Telegram account is the credential.
# Formatting differences ("+1 555 010 2030" vs "+15550102030") don't matter.
# An empty list means nobody can log in. Any number of these accounts can be
# signed in simultaneously; each one has its own files, folders, storage
# channels, download bots, routing rules and upload settings, and cannot see
# another account's.
allowed_phones = ["+15551234567"]

# Phone numbers allowed to reach the operator-only endpoints: the raw-SQL
# browser under /api/internal-db and POST /api/config/reload. Those run
# unrestricted queries over the whole store, so they see and can rewrite
# every signed-in account's files and bot tokens — being signed in is
# deliberately not enough.
# Same format as allowed_phones (spacing and punctuation do not matter), and
# the number must also be in allowed_phones to be able to sign in at all.
# An empty list (the default) leaves those endpoints unreachable for
# everyone, which is the right setting unless you actually need them.
admin_phones = []

# How long issued login tokens stay valid, in seconds (default 30 days)
token_ttl_secs = 2592000

# Embedded SurrealDB storage folder (created automatically)
db_path = "data/drive.surrealkv"

# Telegram MTProto session file. Each signed-in account keeps its own session
# at "<this folder>/sessions/<telegram-user-id>.db"; the path below is only
# read once, to migrate an install that predates multi-account support (its
# files and folders are then assigned to that account).
session_path = "data/session.db"

# Maximum size of a single upload. Free Telegram accounts cap at 2 GiB.
# Accepts plain byte counts ("2147483648") or suffixed forms:
# "2GiB", "2GB" (= 2_000_000_000), "500MiB", "512MB", "1024KiB", "1024KB"
max_file_size = "2GiB"

# How an accepted upload reaches Telegram:
# - "stream" (default): the client body is relayed straight into per-part
#   uploaders. No temporary disk usage, but each part only starts draining
#   once the sequential body feed reaches its offset.
# - "spill": the whole body is buffered to `spill_dir` first, then every
#   part uploads concurrently at full aggregate rate — faster tail on fast
#   pipes, at the cost of the file size in temporary disk space.
upload_strategy = "stream"

# Directory for in-flight upload buffers ("spill" strategy and resumable
# chunked uploads, which always buffer). Created automatically.
spill_dir = "data/spill"

# Folder containing the built web UI (svelte app). Served at "/".
web_dist = "web/dist"

# Folder of web-UI translation files served under /locales/. Only English
# ("en.json") is required — it ships as the bundled fallback. Every other
# language is downloaded by the UI from this repository's locales/ folder on
# GitHub, so the catalog (locales/manifest.json in the repo) and dictionaries
# update without rebuilding or re-releasing the server.
# The file "manifest.json" here is reserved and never offered as a language.
locales_dir = "locales"

# Generate thumbnails for images and videos. Uses ffmpeg for videos when it
# is on PATH; without it, video thumbs fall back to whatever Telegram
# returns and non-video previews still work. Default: true.
#
# This switch covers only the ffmpeg path. Embedded cover art in audio
# uploads (ID3 APIC in mp3, PICTURE blocks in FLAC) is always extracted —
# it is plain byte parsing of the first 512 KiB already in memory, so it
# needs no ffmpeg and costs no extra download.
media_thumbs = true
