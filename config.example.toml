# ii-drive — Telegram Drive configuration
# Copy this file to config.toml and fill in your values.
#
# Every key below is optional — the server starts with these defaults if
# config.toml is missing or a key is omitted. Only api_id/api_hash are
# needed before the drive is usable.
#
# The server reads ./config.toml. Set II_DRIVE_CONFIG to point it elsewhere:
#   II_DRIVE_CONFIG=/etc/ii-drive/config.toml ii-drive
# Relative paths below resolve beside that file, whatever the working
# directory is. The web UI and translations are not configurable: they ship
# with the executable and are found beside it.

# HTTP server bind address
host = "127.0.0.1"
port = 8080

# Telegram API credentials — create an app at https://my.telegram.org/apps
api_id = 0
api_hash = ""

# Secret used to sign session tokens (NOT a login password — logging in is
# done through Telegram). Leave unset and a random secret is generated and
# stored beside the database on first start. Set your own long random
# string only if you need tokens to survive wiping the data directory;
# anyone who knows this value can forge tokens.
# secret = "a-long-random-string-you-keep-safe"

# Phone numbers allowed to log in via Telegram. Login sends a Telegram code
# to the number, so possession of that Telegram account is the credential.
# Formatting differences ("+1 555 010 2030" vs "+15550102030") don't matter.
# An empty list means nobody can log in. Any number of these accounts can be
# signed in simultaneously; each one has its own files, folders, storage
# channels, download bots, routing rules and upload settings, and cannot see
# another account's.
allowed_phones = ["+15551234567"]

# Phone numbers allowed to reach the operator-only endpoints: the raw-SQL
# browser under /api/internal-db and the instance settings at /api/instance.
# The SQL browser runs unrestricted queries over the whole store, so it sees
# and can rewrite every signed-in account's files and bot tokens — being
# signed in is deliberately not enough.
#
# This list stays in the file on purpose. Held in the database it would be a
# list that anyone reaching the SQL browser could extend, so granting
# operator rights would stop requiring access to this machine.
# Same format as allowed_phones (spacing and punctuation do not matter), and
# the number must also be in allowed_phones to be able to sign in at all.
# An empty list (the default) leaves those endpoints unreachable for
# everyone, which is the right setting unless you actually need them.
admin_phones = []

# How long issued login tokens stay valid, in seconds (default 30 days)
token_ttl_secs = 2592000

# Embedded SurrealDB storage folder (created automatically)
db_path = "data/drive.surrealkv"

# Telegram MTProto sessions live at "<this folder>/sessions/<telegram-user-id>.db";
# the path below only names that folder.
session_path = "data/session.db"
# --- At-rest file encryption (optional, off by default) ---
#
# When enabled, newly uploaded files are encrypted on disk and in Telegram
# before they reach a Telegram data center, in a format compatible with
# teldrive (NaCl secretbox, scrypt-derived key). Downloads decrypt on the
# fly.
#
# Two things matter:
#  * The password and salt derive the key. Change either one after files
#    are stored and those files become permanently unreadable — no recovery
#    shortcut exists. Choose a long random password and keep it safe.
#  * Enabling encryption does NOT rewrite files uploaded while it was off;
#    those stay plaintext and are still served as-is. Encryption only
#    affects uploads made after this is turned on.
#
# Set both crypt_password and crypt_enabled = true to turn it on. The salt
# is optional (defaults to "ii-drive").
# crypt_enabled = true
# crypt_password = "a-long-random-password-you-keep-safe"
# crypt_salt = "ii-drive"

# --- Moved to the database ---
#
# The upload cap, the ffmpeg thumbnail switch and the upload strategy used to
# be configured here. They are the settings people actually revisit, so they
# now live in the database and are edited under Settings -> Uploads (or via
# PUT /api/instance) — effective immediately, no restart.
#
# No migration window: an older config.toml that still sets those keys is
# simply ignored — change them under Settings -> Uploads instead.

# Directory for in-flight upload buffers ("spill" strategy and resumable
# chunked uploads, which always buffer). Created automatically.
spill_dir = "data/spill"

# The built web UI and the translation files are not configured here. They
# ship with the executable — a release bundle is the binary with web/dist and
# locales beside it — and are found from it, so moving this file cannot hide
# the UI. An older config.toml setting web_dist or locales_dir is warned
# about and ignored.
